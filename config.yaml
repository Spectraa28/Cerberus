default_provider: groq
default_tier: fast

providers:
  anthropic:
    tiers:
      pro: claude-sonnet-5
      lite: claude-haiku-4-5-20251001
      fast: claude-haiku-4-5-20251001
  openai:
    tiers:
      pro: gpt-5.6-sol
      lite: gpt-5.6-terra
      fast: gpt-5.6-luna
  gemini:
    tiers:
      pro: gemini-3.1-pro
      lite: gemini-3.5-flash-lite
      fast: gemini-3.6-flash

  groq:
    tiers:
      pro: openai/gpt-oss-120b
      lite: openai/gpt-oss-20b
      fast: openai/gpt-oss-20b


runtime:
  max_tokens: 1024
  max_turns: 10

tools:
  shell_default_timeout: 15.0
  search_timeout: 15.0
  ignore_dirs: [".venv", "venv", "__pycache__", ".git", "node_modules"]