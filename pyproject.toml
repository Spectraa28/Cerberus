[project]
name = "cerberus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.120.0",
    "fastapi>=0.140.7",
    "google-genai>=2.14.0",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tavily-python>=0.7.26",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "websockets>=16.1.1",
]
